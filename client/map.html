<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bar-ometre</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css">
    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css">
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>

<div id="loading-overlay">
    <div class="spinner"></div>
</div>

<header>
    <h1>Bar-ometre</h1>
    <form id="search-form" class="search-container">
        <input type="text" name="name" placeholder="Search by name...">
        <input type="text" name="city" placeholder="City (e.g. Paris)">

        <select name="arrondissement">
            <option value="">Any Arrondissement</option>
        </select>

        <label class="toggle-label">
            <input type="checkbox" name="clustering" value="yes" checked>
            Cluster Pins
        </label>
        <button type="submit">Search</button>
    </form>
</header>

<main class="main-container">
    <section class="map-section">
        <div id="map"></div>
    </section>

    <aside class="list-section">
        <h2 id="result-count">Found 0 Bars</h2>
        <div id="bar-list"></div>
    </aside>
</main>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>
<script>
    const form = document.querySelector("#search-form");
    const loadingOverlay = document.querySelector("#loading-overlay");
    const resultCount = document.querySelector("#result-count");
    const barList = document.querySelector("#bar-list");
    const arrondissementSelect = form.elements.arrondissement;

    const map = L.map("map").setView([48.8566, 2.3522], 12);
    let markerLayer = L.markerClusterGroup();
    map.addLayer(markerLayer);

    L.tileLayer("https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png", {
        attribution: "&copy; OpenStreetMap contributors &copy; CARTO",
        maxZoom: 20
    }).addTo(map);

    for (let index = 1; index <= 20; index += 1) {
        const value = String(index).padStart(2, "0");
        const option = document.createElement("option");
        option.value = value;
        option.textContent = `${index}e Arr.`;
        arrondissementSelect.appendChild(option);
    }

    function setLoading(isLoading) {
        loadingOverlay.style.display = isLoading ? "flex" : "none";
    }

    function escapeHtml(value) {
        return String(value ?? "")
            .replaceAll("&", "&amp;")
            .replaceAll("<", "&lt;")
            .replaceAll(">", "&gt;")
            .replaceAll('"', "&quot;")
            .replaceAll("'", "&#039;");
    }

    function buildQuery(params) {
        const query = new URLSearchParams();

        Object.entries(params).forEach(([key, value]) => {
            if (value) {
                query.set(key, value);
            }
        });

        return query.toString();
    }

    function getBarAddress(bar) {
        return [bar.street, bar.house_number, bar.postcode, bar.city].filter(Boolean).join(" ");
    }

    function renderList(bars) {
        resultCount.textContent = `Found ${bars.length} Bars`;

        if (!bars.length) {
            barList.innerHTML = "<p>No bars found. Try a different search.</p>";
            return;
        }

        barList.innerHTML = bars.map((bar) => {
            const website = bar.website
                ? `<a href="${escapeHtml(bar.website)}" target="_blank" rel="noreferrer" class="bar-link">Website</a>`
                : "";
            const directionsUrl = `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(`${bar.name || ""} ${bar.city || ""}`)}`;

            return `
                <article class="bar-card">
                    <div class="bar-img-container">
                        <img src="https://loremflickr.com/320/240/bar,pub,cocktail?lock=${escapeHtml(bar.id)}" alt="" loading="lazy">
                    </div>

                    <div class="bar-info">
                        <div class="bar-name">${escapeHtml(bar.name || "Unknown")}</div>
                        <div class="bar-details">
                            ${escapeHtml(getBarAddress(bar))}<br>
                            ${bar.phone ? `${escapeHtml(bar.phone)}<br>` : ""}

                            <div class="bar-actions">
                                ${website}
                                <a href="${directionsUrl}" target="_blank" rel="noreferrer" class="bar-link">Directions</a>
                            </div>
                        </div>
                    </div>
                </article>
            `;
        }).join("");
    }

    function renderMap(bars, useClustering) {
        map.removeLayer(markerLayer);
        markerLayer = useClustering ? L.markerClusterGroup() : L.layerGroup();

        const bounds = [];

        bars.forEach((bar) => {
            const lat = Number(bar.latitude);
            const lng = Number(bar.longitude);

            if (!Number.isFinite(lat) || !Number.isFinite(lng)) {
                return;
            }

            const popup = `
                <div class="map-popup">
                    <h4>${escapeHtml(bar.name || "Unknown")}</h4>
                    <p>${escapeHtml(getBarAddress(bar))}</p>
                    ${bar.phone ? `<p>${escapeHtml(bar.phone)}</p>` : ""}
                    ${bar.website ? `<a href="${escapeHtml(bar.website)}" target="_blank" rel="noreferrer">Visit Website</a>` : ""}
                </div>
            `;

            L.marker([lat, lng]).bindPopup(popup).bindTooltip(bar.name || "Unknown").addTo(markerLayer);
            bounds.push([lat, lng]);
        });

        map.addLayer(markerLayer);

        if (bounds.length) {
            map.fitBounds(bounds, { padding: [30, 30], maxZoom: 15 });
        }
    }

    async function loadBars(filters = {}) {
        setLoading(true);

        try {
            const query = buildQuery(filters);
            const response = await fetch(`/api/bars${query ? `?${query}` : ""}`);
            const payload = await response.json();

            if (!response.ok) {
                throw new Error(payload.message || "Unable to load bars");
            }

            const bars = payload.data || [];
            renderMap(bars, form.elements.clustering.checked);
            renderList(bars);
        } catch (error) {
            barList.innerHTML = `<p>${escapeHtml(error.message)}</p>`;
            resultCount.textContent = "Found 0 Bars";
        } finally {
            setLoading(false);
        }
    }

    form.addEventListener("submit", (event) => {
        event.preventDefault();

        loadBars({
            name: form.elements.name.value.trim(),
            city: form.elements.city.value.trim(),
            arrondissement: form.elements.arrondissement.value
        });
    });

    form.elements.clustering.addEventListener("change", () => {
        form.requestSubmit();
    });

    loadBars();
</script>

</body>
</html>
